version: '3.8'

services:
  backend:
    build: ./backend
    container_name: callsense-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - audio_uploads:/tmp/callsense_uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: callsense-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  audio_uploads:
